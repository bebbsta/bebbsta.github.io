name: Build Slowfield Audio site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-site.yml"
      - "perculator-interface.jpg"
      - "site-source/**"
      - "release-assets/syndrone/**"

concurrency:
  group: slowfield-site-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website repository
        uses: actions/checkout@v4

      - name: Mirror the current public website
        run: |
          rm -rf _snapshot
          mkdir -p _snapshot
          wget --quiet --mirror --page-requisites --adjust-extension --convert-links --no-parent --no-host-directories --domains plugins.slowfieldaudio.com --directory-prefix=_snapshot https://plugins.slowfieldaudio.com/

      - name: Install corrected Perculator artwork
        run: |
          mkdir -p _snapshot/downloads/perculator
          cp perculator-interface.jpg _snapshot/downloads/perculator/perculator-interface.jpg
          touch _snapshot/.nojekyll

      - name: Install Syndrone release and catalogue page
        run: |
          # Preserve the approved full-resolution Syndrone artwork from the repository,
          # rather than inheriting any stale image from the currently deployed site.
          mkdir -p _snapshot/downloads/syndrone
          cp downloads/syndrone/syndrone-interface.jpg _snapshot/downloads/syndrone/syndrone-interface.jpg
          cp downloads/syndrone/Syndrone-v1.0.5-Expanded-Landscape-User-Guide.pdf _snapshot/downloads/syndrone/Syndrone-v1.0.5-Expanded-Landscape-User-Guide.pdf
          python3 site-source/apply-syndrone.py _snapshot

      - name: Verify Syndrone public release
        run: |
          test -f _snapshot/syndrone_beta_product_page/index.html
          test -f _snapshot/downloads/syndrone/syndrone-interface.jpg
          test -f _snapshot/downloads/syndrone/Syndrone-1.0.5-macOS-Universal.pkg
          test -f _snapshot/downloads/syndrone/Syndrone-1.0.5-Windows-x64-Setup.exe
          test -s _snapshot/downloads/syndrone/Syndrone-v1.0.5-Expanded-Landscape-User-Guide.pdf
          grep -q 'explore Syndrone' _snapshot/plugins.html

      - name: Publish snapshot to main
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _snapshot ! -name perculator-interface.jpg ! -name README.md ! -name site-source ! -name release-assets -exec rm -rf {} +
          cp -a _snapshot/. .
          rm -rf _snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to publish"
          else
            git commit -m "Publish Slowfield Audio website [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi

# Domain restored; rebuild catalogue with Syndrone
