name: Build Slowfield Audio site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-site.yml"
      - "perculator-interface.jpg"

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website repository
        uses: actions/checkout@v4

      - name: Mirror the current public website
        run: |
          rm -rf _snapshot
          mkdir -p _snapshot
          wget --quiet --mirror --page-requisites --adjust-extension --convert-links --no-parent --no-host-directories --domains plugins.slowfieldaudio.com --directory-prefix=_snapshot https://plugins.slowfieldaudio.com/

      - name: Install corrected Perculator artwork
        run: |
          mkdir -p _snapshot/downloads/perculator
          cp perculator-interface.jpg _snapshot/downloads/perculator/perculator-interface.jpg
          touch _snapshot/.nojekyll

      - name: Publish snapshot to main
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _snapshot ! -name perculator-interface.jpg ! -name README.md -exec rm -rf {} +
          cp -a _snapshot/. .
          rm -rf _snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to publish"
          else
            git commit -m "Publish Slowfield Audio website [skip ci]"
            git push
          fi
