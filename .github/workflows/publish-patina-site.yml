name: Publish Patina site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-patina-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download existing Patina installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/patina patina_beta_product_page
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2284-8210-a1d9-eb2c5317f99e/raw?se=2026-09-25T16%3A19%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=aae75275-2295-5faf-b6bf-43d18bd94625&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T14%3A08%3A05Z&ske=2026-09-26T14%3A08%3A05Z&sks=b&skv=2026-02-06&sig=XxOKhIm0KQxWwK6rdi51aGtVFWsFhd0gqvq5S2vo5E0%3D' -o /tmp/patina-mac.zip
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-c544-81f4-9039-f59dd0789dd6/raw?se=2026-09-25T16%3A19%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=b367bfde-d8db-5e8f-832f-3cb5761c5733&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T15%3A45%3A58Z&ske=2026-09-26T15%3A45%3A58Z&sks=b&skv=2026-02-06&sig=h5oYc3R9MzZWOG4X0e7D3vD2RPZJFLafdSMTEptKoL8%3D' -o /tmp/patina-win.zip
          unzip -jo /tmp/patina-mac.zip -d downloads/patina
          unzip -jo /tmp/patina-win.zip -d downloads/patina
          test -s downloads/patina/Patina-0.5.3-macOS.pkg
          test -s downloads/patina/Patina-0.5.3-Windows-Setup.exe

      - name: Publish Patina assets and product page
        shell: bash
        run: |
          printf '%s' '' | base64 -d > downloads/patina/patina-interface.jpg
          printf '%s' '' | base64 -d > downloads/patina/Patina-User-Guide-Landscape.pdf
          printf '%s' '' | base64 -d > patina_beta_product_page/index.html
          printf '%s' '' | base64 -d > /tmp/patch-patina.py
          python3 /tmp/patch-patina.py

      - name: Commit Patina website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/patina patina_beta_product_page plugins.html index.html
          if git diff --cached --quiet; then
            echo 'Patina site already current'
          else
            git commit -m 'Publish Patina product page and installers'
            git push
          fi