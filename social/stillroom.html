<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stillroom Social</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#dcecf7;color:#17324a}
body{display:flex;justify-content:center;align-items:flex-start}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 8%,rgba(255,255,255,.98),rgba(232,244,252,.9) 24%,rgba(176,208,228,.85) 56%,rgba(112,164,196,.8) 100%);
}
.card:before,.card:after{content:"";position:absolute;inset:auto -80px 0;height:420px;background:
linear-gradient(165deg,transparent 0 20%,rgba(255,255,255,.75) 21% 26%,transparent 27% 37%,rgba(235,247,255,.8) 38% 45%,transparent 46%),
linear-gradient(15deg,rgba(255,255,255,.8),rgba(114,164,195,.45));filter:blur(2px);opacity:.7}
.title{position:absolute;top:78px;left:0;right:0;text-align:center;font-size:92px;letter-spacing:.22em;font-weight:300}
.subtitle{position:absolute;top:190px;left:0;right:0;text-align:center;font-size:28px;letter-spacing:.18em}
.features{position:absolute;top:252px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.08em;color:#597994}
.plugin-wrap{position:absolute;top:340px;left:54px;width:972px;height:688px;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(16,45,67,.25);background:#dceaf4;border:1px solid rgba(24,61,88,.22)}
.plugin{width:100%;height:100%;object-fit:cover;display:block}
.brand{position:absolute;top:1130px;left:0;right:0;text-align:center;font-size:28px;letter-spacing:.34em}
.badge{position:absolute;top:1200px;left:0;right:0;text-align:center;font-size:19px;letter-spacing:.35em}
.leftnote,.rightnote{position:absolute;bottom:63px;font-size:16px;line-height:1.55;letter-spacing:.24em}
.leftnote{left:65px}.rightnote{right:65px;text-align:right}
.wave{position:absolute;top:1080px;left:455px;width:170px;height:38px}
.wave svg{width:100%;height:100%}
</style>
</head>
<body>
<div class="card">
  <div class="title">STILLROOM</div>
  <div class="subtitle">Reverb that breathes with the sound</div>
  <div class="features">Space &nbsp;•&nbsp; Bloom &nbsp;•&nbsp; Breathing Room &nbsp;•&nbsp; Warmth &nbsp;•&nbsp; Mix</div>
  <div class="plugin-wrap"><img id="plugin" class="plugin" alt="Stillroom plugin"></div>
  <div class="wave"><svg viewBox="0 0 200 40"><path d="M4 28 C25 28 30 7 51 11 C72 14 78 30 96 25 C114 20 118 13 132 20 C146 27 155 30 190 26" fill="none" stroke="#17324a" stroke-width="2.5"/></svg></div>
  <div class="brand">Slowfield Audio</div>
  <div class="badge">AU / VST3 BETA</div>
  <div class="leftnote">SOUND<br>FINDS<br>SPACE<br>—</div>
  <div class="rightnote">MUSIC<br>BREATHES<br>FURTHER<br>—</div>
</div>
<script>
(async()=>{
  try{
    const t=await (await fetch('/stillroom_beta_product_page.html')).text();
    const m=t.match(/data:image\/(?:png|jpeg);base64,[A-Za-z0-9+/=]+/);
    document.getElementById('plugin').src=m?m[0]:'/stillroom_beta_product_page.html';
  }catch(e){}
})();
</script>
</body></html>
