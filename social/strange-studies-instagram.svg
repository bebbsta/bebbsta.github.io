    <circle cx="365" cy="77" r="34" fill="none" stroke="#77e3d8" stroke-width="5" opacity=".8"/>
    <circle cx="365" cy="77" r="18" fill="none" stroke="#77e3d8" stroke-width="3" opacity=".5"/>
  </g>
