<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12131a"/><stop offset="0.48" stop-color="#25202f"/><stop offset="1" stop-color="#091014"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="40%" r="65%">
    <stop offset="0" stop-color="#b88cff" stop-opacity=".25"/><stop offset="1" stop-color="#00d9c0" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<circle cx="860" cy="220" r="320" fill="#7a4cff" opacity=".12" filter="url(#soft)"/>
<circle cx="180" cy="1120" r="350" fill="#00c7b7" opacity=".10" filter="url(#soft)"/>
<rect width="1080" height="1350" fill="url(#glow)"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#f4f2ef">
